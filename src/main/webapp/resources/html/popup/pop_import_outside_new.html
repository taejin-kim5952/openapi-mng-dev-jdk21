        <!-- laypop script -->
        <script>
        $(".pop_ver " ).dialog({
            autoOpen: false,
            width: 600,
            modal: true,
            buttons: [
                {
                    text: "Ok",
                    click: function() {
                        $( this ).dialog( "close" );
                    }
                },
                {
                    text: "Cancel",
                    click: function() {
                        $( this ).dialog( "close" );
                    }
                }
            ]
        });

        $( ".btn_popup_close" ).click(function( event ) {
            $( "#popup_stocked" ).dialog( "close" );
            event.preventDefault();
        });
        
        $( ".pop_ver" ).dialog( "open" );

        </script>
