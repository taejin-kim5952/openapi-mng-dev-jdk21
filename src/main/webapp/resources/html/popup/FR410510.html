<!-- Layer Pop Start - 카테고리 추가 안내 -->
        <div id="popup_stocked" class="pop_category" title="카테고리 추가 안내">
            <!--  popup content Start  -->
            <div class="popup_content">
                <div class="content_wrap" style="max-height:none;">
                    <div class="">
                        <img src="../../images/common/bg/guidepop01.png" alt="기본정보가 저장 되었습니다. 다음은 카테고리를 추가 하십시오. <좌측 메뉴에서 [카테고리 추가] 버튼을 클릭하여도 추가할 수 있습니다. >">
                    </div>
                </div>

                <p class="etc_text">카테고리를 추가 하시겠습니까?</p>

                <div class="lPop_bottom brd_tp">
                    <button type="button" title="카테고리 추가하기" class="btn btn_black btn_category">카테고리 추가하기</button>
                    <button type="button" title="닫기" class="btn  btn_popup_close">닫기</button>
                </div>

                <div class="chk_agree ar mt20">
                    <a href="javascript:;">
                        <input type="checkbox" id="noview1" name="noview1" title="7일간 열지 않음">
                        <label for="noview1"><span></span>7일간 열지 않음</label>
                    </a>
                </div>
            </div>
        </div>
<!--  // popup content End  - 카테고리 추가 안내 -->

        <!-- laypop script -->
        <script>
        $(".pop_category").dialog({
            autoOpen: false,
            width: 475,
            modal: true,
            buttons: [
                {
                    text: "Ok",
                    click: function() {
                        $( this ).dialog( "close" );
                    }
                },
                {
                    text: "Cancel",
                    click: function() {
                        $( this ).dialog( "close" );
                    }
                }
            ]
        });

        $( ".btn_category" ).click(function( event ) {
            $( "#popup_stocked" ).dialog( "close" );
            event.preventDefault();
        });

        $( ".btn_popup_close" ).click(function( event ) {
            $( "#popup_stocked" ).dialog( "close" );
            event.preventDefault();
        });
        
        $( ".pop_category" ).dialog( "open" );

        </script>
        <!-- //laypop script -->
 
<!-- Layer Pop End -->
