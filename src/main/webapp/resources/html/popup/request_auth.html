<!-- laypop script -->
<script>
  $(".pop_return").dialog({
      autoOpen: false,
      width: 680,
      modal: true,
      buttons: [
          {
              text: "Ok",
              click: function() {
                  $( this ).dialog( "close" );
              }
          },
          {
              text: "Cancel",
              click: function() {
                  $( this ).dialog( "close" );
              }
          }
      ]
  });
  
  $( ".btn_popup_close" ).click(function( event ) {
      $( "#popup_stocked" ).dialog( "close" );
      event.preventDefault();
  });
  
  $( ".pop_return" ).dialog( "open" );
</script>

<script>
  $( function() {
      var dateFormat = "mm/dd/yy",
        from = $( "#picker_before" )
          .datepicker({
            defaultDate: "+1w",
            changeMonth: false,
            // changeYear: true,
            numberOfMonths: 1
          })
          .on( "change", function() {
            to.datepicker( "option", "minDate", getDate( this ) );
          }),
        to = $( "#picker_after" ).datepicker({
          defaultDate: "+1w",
          changeMonth: false,
          // changeYear: true,
          numberOfMonths: 1
        })
        .on( "change", function() {
          from.datepicker( "option", "maxDate", getDate( this ) );
        });
   
      function getDate( element ) {
        var date;
        try {
          date = $.datepicker.parseDate( dateFormat, element.value );
        } catch( error ) {
          date = null;
        }
   
        return date;
      }
  });
      
  $.datepicker.setDefaults({
      dateFormat: 'yy.mm.dd',
      prevText: '이전 달',
      nextText: '다음 달',
      monthNames: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'],
      monthNamesShort: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'],
      // dayNames: ['일', '월', '화', '수', '목', '금', '토'],
      // dayNamesShort: ['일', '월', '화', '수', '목', '금', '토'],
      dayNamesMin: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      showMonthAfterYear: true,
      yearSuffix: '.',
      showOtherMonths: true
      // selectOtherMonths: true
  });
</script>
