<!--/* regFormSharePopup.jsp -> Thymeleaf 프래그먼트 변환. 원본에 safeFileName이 정의되지 않은 채로
     사용되는 버그가 있는데(fnChangeFile 안), 고치지 않고 그대로 재현함 (실행 시 ReferenceError) */-->
<div xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="regFormSharePopup">

<div class="pop_import_api" title="API 불러오기" style="display:none;">
  <div class="popup_content">
    <div class="content_wrap" style="max-height: none;">
      <div class="import_wrap">
        <div class="searching_wrap">
          <div class="select_form ac">
            <span class="txt_bold">SEARCH</span>
            <span class="input_txt wx400"><input type="text" name="popupSchText" id="popupSchText" title="검색어 입력"></span>
            <button type="button" class="btn-lg btn_searching" onClick="javascript:goImportSearch()"><span>검색</span></button>
          </div><!-- .select_form -->
        </div><!-- .searching_wrap -->
        <ul id="popupUl"></ul><!-- #popupUl -->
        <div class="paging" id="popupPaging"></div><!-- #popupPaging -->
      </div><!-- .import_wrap -->
    </div><!-- .content_wrap -->
    <div class="lPop_bottom brd_tp">
      <button type="button" title="닫기" class="btn btn_black" onclick="$('.pop_import_api').dialog('close')">닫기</button>
    </div><!-- .lPop_bottom -->
  </div><!-- .popup_content -->
</div><!-- .pop_import_api -->

<div class="pop_import_extfile" title="외부파일 불러오기" style="display:none;">
  <div class="popup_content">
    <div class="pkg_board">
      <form id="bbsFrm" method="post" enctype="multipart/form-data">
        <table class="table-vw">
          <caption>외부파일 불러오기 Table</caption>
          <colgroup>
            <col style="width: 20%;">
            <col>
          </colgroup>
          <tbody>
            <tr>
              <th scope="row"><div>파일</div></th>
              <td>
                <div>
                  <div class="radio_set">
                    <em><input type="radio" id="r011" name="r01" title="WSDL" value="WSDL" checked><label for="r011"><span></span>WSDL</label></em>
                    <em><input type="radio" id="r012" name="r01" title="YAML" value="YAML"><label for="r012"><span></span>YAML</label></em>
                    <em><input type="radio" id="r013" name="r01" title="JSON" value="JSON"><label for="r013"><span></span>JSON</label></em>
                    <em><input type="radio" id="r014" name="r01" title="APIDOC" value="APIDOC"><label for="r014"><span></span>APIDOC</label></em>
                  </div>
                </div>
              </td>
            </tr>
            <tr id="addr">
              <th scope="row"><div>주소</div></th>
              <td><div><input type="text" title="주소 입력" id="urlPath" value=""></div></td>
            </tr>
          </tbody>
        </table>
      </form><!-- #bbsFrm -->
    </div><!-- .pkg_board -->
    <div class="lPop_bottom brd_tp">
      <button type="button" title="확인" class="btn btn_black btn_sml3" onclick="selYamlUrlData()">확인</button>
      <button type="button" title="취소" class="btn btn_sml3" onclick="$('.pop_import_extfile').dialog('close')">취소</button>
    </div><!-- .lPop_bottom -->
  </div><!-- .popup_content -->
</div><!-- .pop_import_extfile -->

<!-- Layer Pop -->
<div class="pop_alert" title="알림" style="display:none;">
  <div class="popup_content">
    <div class="alert_txt"></div><!-- .alert_txt -->
    <div class="lPop_bottom brd_tp">
      <button type="button" title="Ok" class="btn btn_sml3 btn_black" onclick="$('.pop_alert').dialog('close')">확인</button>
    </div><!-- .lPop_bottom -->
  </div><!-- .popup_content -->
</div><!-- .pop_alert -->

<script>
  $(document).ready(function() {
    $('.pop_import_api').dialog({
      autoOpen: false, width: 880, modal: true, resizable: false
    });
    $('.pop_import_extfile').dialog({
      autoOpen: false, width: 600, modal: true, resizable: false
    });
    $('.pop_alert').dialog({
      autoOpen: false, dialogClass: 'pop_alert_wrap', modal: true, resizable: false
    });
  });
</script>

<!--// outter file script -->
<script th:inline="javascript">
  //외부파일 불러오기 라디오 버튼 클릭 이벤트
  $(document).on('click', 'input[name="r01"]', function() {
    $('#addr').children().remove();
    var html = '';
    if ($(this).val() == 'APIDOC') {
      html += '<th scope="row"><div>첨부파일</div></th>';
      html += '<td>';
      html += '  <div>';
      html += '    <div class="file_upload">';
      html += '      <span class="inpDiv w80"><input type="text" name="" class="file_address w80" title="file_address" readonly="readonly" value="선택된 파일이 없습니다."></span>';
      var strFuncNm = 'fileUploadView';
      html += '      <button type="button" class="btn btn_import" style="left:65%" title="파일선택" onclick="addFile.fnAddFile(this, \'' + strFuncNm + '\')"><span>파일선택</span></button>';
      html += '    </div>';
      html += '    <ul class="file_list" id="fileUploadView"></ul>';
      html += '  </div>';
      html += '</td>';
    }
    else if ($(this).val() == 'YAML' || $(this).val() == 'JSON') {
      html += '<th scope="row"><div>내용</div></th>';
      html += '<td>';
      html += '  <div class="txtarea_wrap"><textarea id="yamlStrFile" title="내용 입력" style="min-height:200px;"></textarea></div>';
      html += '</td>';
    }
    else {
      html += '<th scope="row"><div>주소</div></th>';
      html += '<td>';
      html += '  <div><input type="text" title="주소 입력" id="urlPath" value=""></textarea></div>';
      html += '</td>';
    }
    $('#addr').append(html);
  });

  //파일 첨부
  var addFile = {
    fnAddFile : function(obj, targetObj) {
      if ($('#fileUploadView').children().length == 0) {
        $(obj).find('#hdnFile').remove();
        var html = '<input type="file"  class="filebox"  id="hdnFile" name="uploadFile" onchange="addFile.fnChangeFile(this ,\'' + targetObj + ' \')" />';
        $(obj).parent().append(html);
        $('#hdnFile').click();
      }
      else {
        $('.alert_txt').html('첨부파일은1건 이상 등록 되지 않습니다.');
        $('.pop_alert').dialog('open');
        return false;
      }
    }, //-- fnAddFile()
    fnChangeFile : function(obj, targetObj) {
      var file = $(obj)[0].files[0];

      var maxSize = 26214400; // 25MB
      var ext = file.name.split('.').pop().toLowerCase();
      var fileSize = file.size;
      if (ext != 'js' && ext != 'c' && ext != 'java' && ext != 'cs') {
        $('.alert_txt').html('js,c,java,cs 형식만 지원가능합니다.');
        $('.pop_alert').dialog('open');
        $('#hdnFile').remove();
        return false;
      }

      if (fileSize > maxSize) {
        $('.alert_txt').html('첨부파일의 용량이 너쿠 큽니다. <br/>25MB 미만의 파일을 첨부해 주세요.');
        $('.pop_alert').dialog('open');
        $('#hdnFile').remove();
        return false;
      }
      //var li = '<li><a href="#file" title="' + file.name + '" class="filedwn_txt">' + file.name + '</a><button type="button" class="btn .btn.round_sty" title="delete" onclick="addFile.fnDelFile(this, \' \')"><span>삭제</span></button></li>';
	  var escapeHtml = function(str) {
		return String(str)
		         .replace(/&/g, '&amp;')
		         .replace(/</g, '&lt;')
		         .replace(/>/g, '&gt;')
		         .replace(/"/g, '&quot;')
		         .replace(/'/g, '&#39;');
	  };
	  var li = '<li><a href="#file" title="' + safeFileName + '" class="filedwn_txt">' + safeFileName + '</a><button type="button" class="btn .btn.round_sty" title="delete" onclick="addFile.fnDelFile(this, \' \')"><span>삭제</span></button></li>';
      $('#' + targetObj).append(li);
    }, //-- fnChangeFile()
    fnDelFile : function(obj, atcFileNo) {
      if (atcFileNo == ' ') {//등록 화면에서의 파일 삭제
        $(obj).parent().remove();
        $('#hdnFile').remove();
      }
      else {
        //수정 화면에서의 파일 삭제
        $('<input></input>').attr({ type : 'hidden', name : 'delAtcFileNo', value : atcFileNo }).appendTo($('#bbsFrm'));
        $(obj).parent().remove();
        $('#hdnFile').remove();
      }
    }, //-- fnDelFile()
    fileUpload : function(seq) {
      $('#bbsFrm').ajaxForm({
        url : /*[[@{/api/reg/regApidocAjax.do}]]*/ '/api/reg/regApidocAjax.do',
        type : 'POST',
        dataType : 'json',
        async : false,
        cache : false,
        // enctype : 'multipart/form-data',
        success : function(result) {
          // console.log(result);
          $('#frm').find('#qnaId').val(result.qnaId);
          $('#frm').attr({ action : c_url + 'qna/mvQnaView.do', method : 'post' }).submit();
          if (('Y' == result.yamlInfo.successYn) && ('' != result.yamlInfo.jsonStr)) {
            $('#importYamlSbst').val(result.yamlInfo.jsonStr);
            $('#importYn').val('Y');
            $('#apiImportForm').submit();
          }
          else {
            $('.alert_txt').html('외부파일 불러오기에 실패했습니다.');
            $('.pop_alert').dialog('open');
          }
        },
        error : function(request, status, error) {
          err_message(status, error);
          // alert('code:'+request.status+'\n'+'message:'+request.responseText+'\n'+'error:'+error);
        }
      });
      $('#bbsFrm').submit();
      // $('#bbsFrm').attr('action', c_url+'qna/saveQna.do').submit();
    }, //-- fileUpload()
  } //-- var addFile = {
</script>
<!-- outter file script //-->

</th:block>
</div>
