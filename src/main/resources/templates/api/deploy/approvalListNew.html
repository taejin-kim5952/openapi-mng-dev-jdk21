   // 날짜 계산 함수
function getCalculatedDate(iYear, iMonth, iDay, seperator)
{
	 //현재 날짜 객체를 얻어옴.
	 var gdCurDate = new Date();
	 //현재 날짜에 날짜 게산.
	 gdCurDate.setYear( gdCurDate.getFullYear() + iYear );
	 gdCurDate.setMonth( gdCurDate.getMonth() + iMonth );
	 gdCurDate.setDate( gdCurDate.getDate() + iDay );

	 //실제 사용할 연, 월, 일 변수 받기.
	 var giYear = gdCurDate.getFullYear();
	 var giMonth = gdCurDate.getMonth()+1;
	 var giDay = gdCurDate.getDate();
	 //월, 일의 자릿수를 2자리로 맞춘다.
	 giMonth = "0" + giMonth;
	 giMonth = giMonth.substring(giMonth.length-2,giMonth.length);
	 giDay   = "0" + giDay;
	 giDay   = giDay.substring(giDay.length-2,giDay.length);
	 //display 형태 맞추기.
	 return giYear + seperator + giMonth + seperator +  giDay;
}

            html+=	' </tr> ';
  				}); //each끝
  			}
  			else {

			}
			if (msg.length > 0) {

}

						html += '</tr>'
					});
				}
				else {
					msg = '검색된 DATA가 존재하지 않습니다.';
				}
			}
			if (msg.length > 0) {
				var colspan = $('#verifiHst > thead > tr').children().length;
				html += '<tr>';
				html += '<td colspan="' + colspan + '">';
				html += msg;
				html += '</td>';
				html += '</tr>';

			$('#verifiHst > tbody').append(html);
		},
		error: function(request, status, error) {

function fnDeployReject() {

		//var obj = new Object();
		var deployApiArray = [];


		var mapValue = $('input:checkbox[type=checkbox]:checked').each(function () {
			var jsonObj = new Object();

			jsonObj.procseq 		= JSON.parse($(this).val()).proc_seq;
			jsonObj.deployapplyseq  = JSON.parse($(this).val()).deployapply_seq;

			deployApiArray.push(jsonObj);
		})


		var objParams = {
				"deployApiList" : deployApiArray,
				"rejectMsg" : $("#txtCbDeployCancel").val()
		};


		$.ajax({
			url: /*[[@{/api/deploy/deployRejectAjax.do}]]*/ '/api/deploy/deployRejectAjax.do',
			type: 'POST',
			data: JSON.stringify(objParams),
			dataType : 'json',
			contentType:'application/json; charset=utf-8',
			success: function(data){


				////조회항목 - 시스템

					modalPopClose("popup_deployReject");
