# 공통 설정 및 인프라 설정 (mngOnm 표준)
# 기존 context-properties.xml 및 propertiesService 설정 이식

# SafeDB Agent에 접근 불가한 로컬 개발 환경에서 실제 암/복호화 호출을 건너뛰기 위한 스위치
# 기본값은 항상 false(실제 SafeDB 사용). 로컬에서만 VM option(-Dsafedb.mock.enabled=true)
# 또는 환경변수(SAFEDB_MOCK_ENABLED=true)로 켤 것 — tb/prod 배포에는 영향 없음
safedb:
  mock:
    enabled: ${SAFEDB_MOCK_ENABLED:false}

pageUnit: 10
pageSize: 10
noticePageSize: 5
noticePageUnit: 5

spring:
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: kt/message/message-common
    encoding: UTF-8
    cache-duration: 60s
  mvc:
    static-path-pattern: /resources/**
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis 공통 설정
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
  mapper-locations: classpath:/kt/sqlmap/**/*.xml

# [마이그레이션] 스케줄러 설정 외부화
scheduler:
  pool-size: 10
  cron:
    # 예시: 기존 하드코딩된 값들을 나중에 여기로 이전 가능
    cleaning: "0 0/30 * * * ?" # 30분마다 실행 (fixedRate 1800000 대응)
    ucloud: "0 10 2 * * ?"
    gigagenie: "0 20 2 * * ?"
    shub: "0 30 4 * * ?"
    olleh: "0 20 6 * * ?"
    ktservice: "0 0 1 * * ?"
