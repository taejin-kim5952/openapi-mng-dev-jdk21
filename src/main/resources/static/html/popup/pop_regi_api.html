<!DOCTYPE html>
<html lang="ko">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Kt Open API - Comment Review API</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <meta name="description" content="Visual API Designer for OpenAPI (swagger) specification. Design beautiful, functional APIs with zero coding, using OpenAPI" />
    <meta property="og:description" content="Visual API Designer for OpenAPI (swagger) specification. Design beautiful, functional APIs with zero coding, using OpenAPI" />

    <link rel="icon" type="image/png" href="../../images/common/icon/icon_32.png" />

<link href="../../css/style.css" rel="stylesheet" media="screen">
    <script src="../../js/pub/jquery.easing.1.3.js"></script>

    <script src="../../js/pub/jquery-2.1.4.min.js"></script>
    <script src="../../js/pub/jquery-ui.js"></script>
    <script src="../../js/pub/main.js"></script>
    <script src="../../js/pub/ui.js"></script>

    <!--[if lt IE 9]>
     <script type="text/javascript" src="../../js/pub/html5.js"></script>
     <script src="../../js/pub/respond.min.js"></script>
     <![endif]-->
        <!--[if lt IE 9]>
     <script src="../../js/pub/css3-mediaqueries.js"></script>
     <![endif]-->
     <!--[if IE]>
        <script type="text/javascript">
             var console = { log: function() {} };
        </script>
    <![endif]-->
</head>

<body>

<!-- Layer Pop Start - 버전업 -->
        <div id="popup_stocked" class="pop_ver" title="버전업">
            <!--  popup content Start  -->
            <div class="popup_content">
                <div class="pkg_board">
                    <!-- writeform -->
                    <table class="table-vw">
                        <caption>API 검토요청 내용 Table</caption>
                        <colgroup>
                            <col style="width:20%;">
                            <col >
                        </colgroup>

                        <tbody>
                            <tr>
                                <th scope="row"><div>버전</div></th>
                                <td class="ver_field"><div><input type="text" name="ver_value" title="버전 입력"></div><span class="new_ver">최신버전 : <strong>1.01</strong></span></td>
                            </tr>
                            
                            <tr>
                                <th scope="row"><div>코멘트</div></th>
                                <td>
                                    <div class="txtarea_wrap"><textarea title="코멘트 입력"></textarea></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- // writeform -->
                </div>

                <div class="lPop_bottom brd_tp">
                    <button type="button" title="API생성" class="btn btn_black">API생성</button>
                    <button type="button" title="취소" class="btn">취소</button>
                </div>
            </div>
        </div>
<!--  // popup content End  - 버전업 -->

<!-- Layer Pop Start - 코멘트 -->
        <div id="popup_stocked" class="pop_comment" title="코멘트">
            <!--  popup content Start  -->
            <div class="popup_content">
                <div class="pkg_board">
                    <!-- writeform -->
                    <table class="table-vw">
                        <caption>API 검토요청 내용 Table</caption>
                        <colgroup>
                            <col style="width:20%;">
                            <col >
                        </colgroup>

                        <tbody>
                            <tr>
                                <th scope="row"><div>버전</div></th>
                                <td class="ver_field">1.01</td>
                            </tr>
                            
                            <tr>
                                <th scope="row"><div>코멘트</div></th>
                                <td>
                                    <div class="txtarea_wrap">인증 툴 부분에 대한
                                    스크립트가 추가 되었습니다.</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- // writeform -->
                </div>

                <div class="lPop_bottom brd_tp">
                    <button type="button" title="닫기" class="btn btn_black">닫기</button>
                </div>
            </div>
        </div>
<!--  // popup content End  - 코멘트 -->

        <!-- laypop script -->
        <script>
        $(".pop_ver ,.pop_comment" ).dialog({
            autoOpen: false,
            width: 600,
            modal: true,
            buttons: [
                {
                    text: "Ok",
                    click: function() {
                        $( this ).dialog( "close" );
                    }
                },
                {
                    text: "Cancel",
                    click: function() {
                        $( this ).dialog( "close" );
                    }
                }
            ]
        });

        $( ".btn_popup_close" ).click(function( event ) {
            $( "#popup_stocked" ).dialog( "close" );
            event.preventDefault();
        });
        
        $( ".pop_ver" ).dialog( "open" );
        $( ".pop_comment" ).dialog( "open" );

        </script>
        <!-- //laypop script -->
 
<!-- Layer Pop End -->       


    </div>
    <!-- //.wrap -->

</body>

</html>
