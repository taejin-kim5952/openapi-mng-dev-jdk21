        <!-- laypop script -->
        <script>
        $(".pop_alert" ).dialog({
            autoOpen: false,
            dialogClass: 'pop_alert_wrap',
            modal: true,            
            buttons: [
                {
                    text: "Ok",
                    click: function() {
                        $( this ).dialog( "close" );
                    }
                },
                {
                    text: "Cancel",
                    click: function() {
                        $( this ).dialog( "close" );
                    }
                }
            ]
        });

        $( ".btn_confirm" ).click(function( event ) {
            $( "#popup_stocked" ).dialog( "close" );
            event.preventDefault();
        });

        $( ".btn_popup_close" ).click(function( event ) {
            $( "#popup_stocked" ).dialog( "close" );
            event.preventDefault();
        });
        
        $( ".pop_alert" ).dialog( "open" );
