name: workflow - dev

permissions:
  id-token: write
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        default: "latest"

# env는 개발자가 직접 수정
env:
  ENV: dev
  APPLICATION_NAME: openapi-mng-dev
  nexus_username: ktds-nexus
  spring_profile: tb

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, maven]
    outputs:
      DOCKER_IMAGE_NAME: ${{ steps.setenv.outputs.DOCKER_IMAGE_NAME }}
      DOCKER_IMAGE_TAG: ${{ steps.setenv.outputs.DOCKER_IMAGE_TAG }}
      IMAGE_NAME: ${{ steps.setenv.outputs.IMAGE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Parse Azure credentials
        id: parse-credentials
        run: |
          echo "AZURE_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS_DEV }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "AZURE_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS_DEV }}' | jq -r .tenantId)" >> $GITHUB_ENV
          echo "AZURE_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS_DEV }}' | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "AZURE_KEYVAULT_NAME=$(echo '${{ secrets.AZURE_CREDENTIALS_DEV }}' | jq -r .keyVaultName)" >> $GITHUB_ENV

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          federated-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve secrets from Azure Key Vault
        id: get-secrets
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: ${{ env.AZURE_KEYVAULT_NAME }}
          secrets: "ACR-SERVER, ACR-USERNAME, ACR-PASSWORD, PROXY-PASSWORD"

      - name: Set environment variables
        id: setenv
        run: |
          echo "DOCKER_IMAGE_NAME=${ENV}/${APPLICATION_NAME}" >> $GITHUB_OUTPUT          
          echo "DOCKER_IMAGE_TAG=${{ github.event.inputs.version || github.sha }}" >> $GITHUB_OUTPUT    
          echo "IMAGE_NAME=${ENV}/${APPLICATION_NAME}:${{ github.event.inputs.version || github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "jdkfile"
          jdkFile: /actions-runner/languages/java/17.0.10/microsoft-jdk-17.0.10-linux-x64.tar.gz
          java-version: "17.0.10"
          architecture: x64

      - name: Set up Maven
        uses: hb0730/maven-action@v1.0.2
        with:
          maven-file: /actions-runner/build-tools/maven/3.8.1/apache-maven-3.8.1-bin.tar.gz

      - name: Set up settings.xml
        run: |
          cat <<EOF > ./settings.xml
          <settings>
            <servers>
                  <server>
                      <id>maven-default-http-blocker</id>
                      <username>${{ env.nexus_username }}</username>
                      <password>${{ steps.get-secrets.outputs.PROXY-PASSWORD }}</password>
                  </server>
              </servers>

              <mirrors>
                  <mirror>
                    <id>maven-default-http-blocker</id>
                    <mirrorOf>*</mirrorOf>
                    <name>Pseudo repository to mirror external repositories initially using HTTP.</name>
                    <url>http://build-proxy.azdevops.kt.co.kr/repository/maven-public</url>
                    <blocked>false</blocked>
                  </mirror>
              </mirrors>
          </settings>
          EOF
        shell: bash

      - name: Build with Maven
        run: mvn -s ./settings.xml -DskipTests clean package

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ steps.get-secrets.outputs.ACR-SERVER }}
          username: ${{ steps.get-secrets.outputs.ACR-USERNAME }}
          password: ${{ steps.get-secrets.outputs.ACR-PASSWORD }}

      - name: Docker Build
        run: |
          docker build -t ${{ steps.get-secrets.outputs.ACR-SERVER }}/${{ steps.setenv.outputs.DOCKER_IMAGE_NAME }}:${{ steps.setenv.outputs.DOCKER_IMAGE_TAG }} --build-arg env=${{ env.spring_profile }} -f Dockerfile_dev . 

      - name: Docker Push
        run: |
          docker push ${{ steps.get-secrets.outputs.ACR-SERVER }}/${{ steps.setenv.outputs.DOCKER_IMAGE_NAME }}:${{ steps.setenv.outputs.DOCKER_IMAGE_TAG }}

  run-trivy:
    needs: build
    runs-on: [trivy-arc]
    permissions:
      id-token: write
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v3

      - name: Login to ACR
        uses: ktdev-templates/kv-docker-login@v1
        with:
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS_DEV }}
      - name: Run Trivy and Upload Results
        uses: ktdev-templates/trivy-arc-container@v1
        with:
          image: "${{ needs.build.outputs.IMAGE_NAME }}"
